[package]
name        = "codex-gateway"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/JafarAbdi/codex-gateway"
description = "Shared ChatGPT Codex OAuth gateway for Shelley instances"

[dependencies]
anyhow             = "1"
axum               = "0.8"
base64             = "0.22"
clap               = { version = "4", features = ["derive", "env"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd               = "0.13"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
