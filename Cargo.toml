[package]
name        = "codex-gateway"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/JafarAbdi/codex-gateway"
description = "Shared ChatGPT Codex OAuth gateway for pi instances"

[dependencies]
anyhow             = "1"
axum               = { version = "0.8", features = ["ws"] }
base64             = "0.22"
futures-util       = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
tokio              = { version = "1", features = ["rt", "macros", "net", "signal", "time"] }
tokio-tungstenite  = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
opt-level     = "z"
panic         = "abort"
