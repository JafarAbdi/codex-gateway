[package]
name        = "codex-gateway"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/JafarAbdi/codex-gateway"
description = "Shared ChatGPT Codex OAuth gateway for Shelley instances"

[dependencies]
anyhow             = "1"
axum               = "0.8"
base64             = "0.22"
reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
tokio              = { version = "1", features = ["rt", "macros", "net", "signal", "time"] }
zstd               = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
opt-level     = "z"
panic         = "abort"

# The proxy is I/O-bound; only the zstd C code is hot, so it keeps full optimization.
[profile.release.package.zstd-sys]
opt-level = 3
